services:
  - type: web
    name: openreply
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: openreply-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: openreply-redis
          type: keyvalue
          property: connectionString
      - fromGroup: openreply-shared
      - key: NEXTAUTH_URL
        value: https://openreply-e2cs.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0

  - type: worker
    name: openreply-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: openreply-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: openreply-redis
          type: keyvalue
          property: connectionString
      - fromGroup: openreply-shared
      - key: NEXTAUTH_URL
        value: https://openreply-e2cs.onrender.com
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0

  - type: keyvalue
    name: openreply-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: openreply-postgres
    region: singapore
    plan: free
    postgresMajorVersion: "17"

envVarGroups:
  - name: openreply-shared
    envVars:
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
